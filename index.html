<style>
  :root {
    /* צבעי המותג */
    --green: #00e676;
    --blue: #2f80ff;
    --red: #ff2e55;

    --bg: #05080d;
    --bg-2: #0b1119;
    --card: #0d1520;
    --line: #15222f;
    --text: #e8f0f7;
    --muted: #8a9aab;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Heebo", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background-image:
      linear-gradient(rgba(0,230,118,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,128,255,.07) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at top, #000 10%, transparent 70%);

  .mono { font-family: "JetBrains Mono", monospace; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  a { color: inherit; text-decoration: none; }
  .g { color: var(--green); } .b { color: var(--blue); } .r { color: var(--red); }

  /* ===== אנימציית פתיחה ===== */
  #intro {
    position: fixed; inset: 0; z-index: 100; background: #000;
    transition: opacity .9s ease, visibility .9s;
    cursor: pointer;
  }
  #intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #intro .center {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  }
  #intro .title {
    font-family: "JetBrains Mono", monospace; font-weight: 800;
    font-size: clamp(1.8rem, 7vw, 4.5rem); letter-spacing: .04em;
    color: var(--green); text-align: center; direction: ltr;
    text-shadow: 0 0 18px rgba(0,230,118,.8), 0 0 40px rgba(0,230,118,.4);
    background: rgba(0,0,0,.55); padding: 10px 26px; border-radius: 12px;
    opacity: 0; transform: scale(.94); transition: opacity .6s, transform .6s;
  }
  #intro .title.on { opacity: 1; transform: none; }
  #intro .title .cursor { display: inline-block; width: .55em; height: 1em; background: var(--green); vertical-align: -.12em; animation: blink .8s steps(1) infinite; margin-inline-start: 6px; }
  #intro .skip {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(0,230,118,.6); font: 600 .8rem "JetBrains Mono", monospace; letter-spacing: .1em;
  }
  #intro.done { opacity: 0; visibility: hidden; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Nav */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(5,8,13,.82); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
  .logo { font-weight: 800; color: var(--green); direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .logo .r { color: var(--red); }
  .links { display: flex; gap: 22px; font-size: .95rem; color: var(--muted); }
  .links a:hover { color: var(--blue); }
  .lang {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: .85rem;
  }
  .lang:hover { border-color: var(--blue); color: var(--blue); }

  /* Hero */
  header.hero { padding: 110px 0 90px; }
  .tag { color: var(--red); font-size: .9rem; margin-bottom: 14px; }
  h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 800; line-height: 1.15; }
  h1 .name {
    background: linear-gradient(90deg, var(--green), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 .role { display: block; font-size: .55em; font-weight: 600; color: var(--text); margin-top: 10px; }
  h1 .role::before { content: "> "; color: var(--red); font-family: "JetBrains Mono", monospace; }
  .hero p.lead { color: var(--muted); font-size: 1.2rem; max-width: 620px; margin: 20px 0 34px; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    padding: 12px 24px; border-radius: 10px; font-weight: 600; border: 1px solid var(--line);
    transition: transform .15s, border-color .15s, box-shadow .15s; display: inline-block;
  }
  .btn:hover { transform: translateY(-2px); border-color: var(--blue); box-shadow: 0 0 20px rgba(47,128,255,.25); }
  .btn.primary { background: var(--green); color: #00140a; border-color: var(--green); }
  .btn.primary:hover { box-shadow: 0 0 24px rgba(0,230,118,.45); }

  /* Sections */
  section { padding: 70px 0; }
  h2 { font-size: 1.8rem; margin-bottom: 28px; display: flex; align-items: center; gap: 12px; }
  h2 .num { color: var(--red); font-size: 1rem; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--green), var(--blue), var(--red)); opacity: .45; }
  [dir="rtl"] h2::after { background: linear-gradient(270deg, var(--green), var(--blue), var(--red)); }
  .about { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40px; align-items: start; }
  .about p { color: var(--muted); margin-bottom: 14px; }
  .avatar {
    aspect-ratio: 1; border-radius: var(--radius); border: 1px solid var(--line);
    background:
      radial-gradient(circle at 30% 20%, rgba(0,230,118,.18), transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(255,46,85,.15), transparent 55%),
      linear-gradient(135deg, var(--card), var(--bg-2));
    display: grid; place-items: center; font: 800 4rem "JetBrains Mono", monospace; color: var(--green);
    text-shadow: 0 0 20px rgba(0,230,118,.5);
    overflow: hidden;

  .avatar:has(img) { border-color: rgba(47,128,255,.45); box-shadow: 0 0 40px rgba(47,128,255,.25), 0 0 0 1px rgba(0,230,118,.15) inset; }

  /* Edge */
  .edge { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .edge .item {
    --c: var(--green);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; position: relative; overflow: hidden; transition: transform .2s, border-color .2s;
  }
  .edge .item::before { content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
  .edge .item:hover { transform: translateY(-4px); border-color: var(--c); }
  .edge .k { font: 800 .8rem "JetBrains Mono", monospace; color: var(--c); letter-spacing: .08em; }
  .edge h3 { font-size: 1.15rem; margin: 6px 0 8px; }
  .edge p { color: var(--muted); font-size: .95rem; }
  .edge-lead { color: var(--muted); max-width: 680px; margin: -8px 0 26px; font-size: 1.05rem; }

  .skills { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { padding: 8px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: .9rem; }
  .chip:nth-child(3n+1) { color: var(--green); } .chip:nth-child(3n+2) { color: var(--blue); } .chip:nth-child(3n) { color: var(--red); }

  .timeline { border-inline-start: 2px solid var(--line); padding-inline-start: 24px; }
  .job { position: relative; margin-bottom: 34px; }
  .job::before {
    content: ""; position: absolute; inset-inline-start: -31px; top: 8px;
    width: 12px; height: 12px; border-radius: 50%; background: var(--green);

  }
  .job .when { color: var(--red); font-size: .85rem; }
  .job h3 { font-size: 1.15rem; }
  .job .where { color: var(--blue); }
  .job p { color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px; transition: transform .2s, border-color .2s; display: flex; flex-direction: column; gap: 10px;

  .card:hover { transform: translateY(-4px); border-color: var(--blue); }
  .card h3 { font-size: 1.15rem; }
  .card p { color: var(--muted); flex: 1; }
  .card .stack { display: flex; flex-wrap: wrap; gap: 8px; font-size: .78rem; color: var(--green); }

  .contact { text-align: center; }
  .contact p { color: var(--muted); max-width: 520px; margin: 0 auto; }
  #contact { padding-bottom: 40px; }

  /* אייקונים */
  .icons { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .icons a {
    --c: var(--green);
    width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); color: var(--c);
    transition: transform .2s, color .2s, border-color .2s, box-shadow .2s;

  .icons svg { width: 24px; height: 24px; }
  .icons a[title="LinkedIn"] svg { border-radius: 3px; }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 44px 0 36px; border-top: 1px solid var(--line); }
  footer .icons { margin-bottom: 22px; }
  footer .brandline { height: 3px; width: 120px; margin: 0 auto 18px; border-radius: 3px; background: linear-gradient(90deg, var(--green), var(--blue), var(--red)); }

  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .6s, transform .6s; }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 760px) {
    .links { display: none; }
    .about { grid-template-columns: 1fr; }
    .avatar { max-width: 220px; }
    header.hero { padding: 70px 0 50px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #intro { display: none; }
    .reveal { opacity: 1; transform: none; }
  }
</style>

const get = (obj, path) => path.split(".").reduce((o, k) => o && o[k], obj);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function iconLinks() {
  return PROFILE.contacts.map(c => {
    const ext = c.url.startsWith("http");
    return `<a href="${esc(c.url)}" style="--c:${c.color}" aria-label="${esc(c.label)}" title="${esc(c.label)}"${ext ? ' target="_blank" rel="noopener"' : ""}>${ICONS[c.icon]}</a>`;
  }).join("");
}

function render(lang) {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  document.title = t.hero.name;
  document.querySelectorAll("[data-k]").forEach(el => { el.textContent = get(t, el.dataset.k); });
  document.getElementById("langBtn").textContent = t.langBtn;

  document.getElementById("aboutText").innerHTML = t.about.map(p => `<p>${esc(p)}</p>`).join("");
  document.getElementById("avatar").innerHTML = PROFILE.photo
    ? `<img src="${esc(PROFILE.photo)}" alt="${esc(t.hero.name)}">`
    : esc(PROFILE.initials);
  const edgeColors = ["var(--green)", "var(--blue)", "var(--red)", "var(--green)"];
  document.getElementById("edgeList").innerHTML = t.edge.map((e, i) => `
    <div class="item" style="--c:${edgeColors[i % 4]}">
      <div class="k">${esc(e.k)}</div>
      <h3>${esc(e.t)}</h3>
      <p>${esc(e.d)}</p>
    </div>`).join("");
  document.getElementById("skillsList").innerHTML = PROFILE.skills.map(s => `<span class="chip mono">${esc(s)}</span>`).join("");
  document.getElementById("jobs").innerHTML = t.jobs.map(j => `
    <div class="job">
      <div class="when mono">${esc(j.when)}</div>
      <h3>${esc(j.title)} · <span class="where">${esc(j.where)}</span></h3>
      <p>${esc(j.desc)}</p>
    </div>`).join("");
  document.getElementById("projectsGrid").innerHTML = t.projects.map(p => `
    <a class="card" href="${esc(p.url)}" target="_blank" rel="noopener">
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.desc)}</p>
      <div class="stack mono">${p.stack.map(s => `<span>${esc(s)}</span>`).join("")}</div>
      <span class="mono" style="color:var(--blue);font-size:.85rem">${esc(t.view)}</span>
    </a>`).join("");
  document.getElementById("footerIcons").innerHTML = iconLinks();
  document.getElementById("year").textContent = new Date().getFullYear();

  // הסתרת אזורים ריקים (וגם הקישור אליהם בתפריט)
  const has = { skills: PROFILE.skills.length, experience: t.jobs.length, projects: t.projects.length };
  let n = 1;
  ["about", "edge", "skills", "experience", "projects", "contact"].forEach(id => {
    const show = !(id in has) || has[id] > 0;
    document.getElementById(id).style.display = show ? "" : "none";
    document.querySelector(`.links a[href="#${id}"]`).style.display = show ? "" : "none";
    if (show) document.querySelector(`#${id} h2 .num`).textContent = String(n++).padStart(2, "0") + ".";
  });
}

let lang = "he";
try { lang = localStorage.getItem("lang") || "he"; } catch (e) {}
render(lang);
document.getElementById("langBtn").onclick = () => {
  lang = lang === "he" ? "en" : "he";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render(lang);
};

const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("in")), { threshold: .1 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* ===== אנימציית פתיחה: 0 ו-1 ירוקים יורדים מלמעלה למטה ===== */
(function intro() {
  const intro = document.getElementById("intro");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { intro.remove(); return; }
  const cv = document.getElementById("matrix"), ctx = cv.getContext("2d");
  const size = 18;
  let w, h, cols, drops, speeds, running = true;
  document.body.style.overflow = "hidden";

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / size);
    // כל עמודה מתחילה מעל המסך בגובה אקראי, כך שהגשם יורד בהדרגה
    drops = Array.from({ length: cols }, () => -Math.random() * h * 0.9);
    speeds = Array.from({ length: cols }, () => 0.6 + Math.random() * 0.9);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
  }
  resize();
  addEventListener("resize", resize);

  function frame() {
    if (!running) return;
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0, 0, w, h);
    ctx.font = `600 ${size}px "JetBrains Mono", monospace`;
    for (let i = 0; i < cols; i++) {
      const ch = Math.random() < 0.5 ? "0" : "1";
      const x = i * size, y = drops[i];
      // הראש של כל טור בהיר, והזנב ירוק
      ctx.shadowColor = "#00e676"; ctx.shadowBlur = 8;
      ctx.fillStyle = "#c8ffe0";
      ctx.fillText(ch, x, y);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#00e676";
      ctx.fillText(Math.random() < 0.5 ? "0" : "1", x, y - size);
      drops[i] += size * speeds[i];
      if (drops[i] > h + size * 2 && Math.random() > 0.96) drops[i] = -size * Math.random() * 10;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // כיתוב שמוקלד אחרי שהגל מתחיל
  const title = document.getElementById("introTitle"), txt = document.getElementById("introText");
  const word = "MALACHI MIRVIS";
  setTimeout(() => {
    title.classList.add("on");
    let k = 0;
    const typer = setInterval(() => { txt.textContent = word.slice(0, ++k); if (k >= word.length) clearInterval(typer); }, 70);
  }, 900);

  let closed = false;
  function close() {
    if (closed) return; closed = true;
    intro.classList.add("done");
    document.body.style.overflow = "";
    setTimeout(() => { running = false; intro.remove(); }, 950);
  }
  setTimeout(close, 4200);
  intro.addEventListener("click", close);
  addEventListener("keydown", close, { once: true });
})();
</script>
