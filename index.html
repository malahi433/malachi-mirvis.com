<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מלאכי מירוויס</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#05080d">
<meta name="description" content="מלאכי מירוויס · AI · פיתוח תוכנה · יזמות">
<meta property="og:title" content="מלאכי מירוויס">
<meta property="og:description" content="AI · פיתוח תוכנה · יזמות">
<meta property="og:url" content="https://malachi-mirvis.com/">
<meta property="og:image" content="https://malachi-mirvis.com/profile.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    /* צבעי המותג */
    --green: #00e676;
    --blue: #2f80ff;
    --red: #ff2e55;

    --bg: #05080d;
    --bg-2: #0b1119;
    --card: #0d1520;
    --line: #15222f;
    --text: #e8f0f7;
    --muted: #8a9aab;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Heebo", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background-image:
      linear-gradient(rgba(0,230,118,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,128,255,.07) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at top, #000 10%, transparent 70%);
  }
  .mono { font-family: "JetBrains Mono", monospace; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  a { color: inherit; text-decoration: none; }
  .g { color: var(--green); } .b { color: var(--blue); } .r { color: var(--red); }

  /* ===== אנימציית פתיחה ===== */
  #intro {
    position: fixed; inset: 0; z-index: 100; background: #000;
    transition: opacity .9s ease, visibility .9s;
    cursor: pointer;
  }
  #intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #intro .center {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  }
  #intro .title {
    font-family: "JetBrains Mono", monospace; font-weight: 800;
    font-size: clamp(1.8rem, 7vw, 4.5rem); letter-spacing: .04em;
    color: var(--green); text-align: center; direction: ltr;
    text-shadow: 0 0 18px rgba(0,230,118,.8), 0 0 40px rgba(0,230,118,.4);
    background: rgba(0,0,0,.55); padding: 10px 26px; border-radius: 12px;
    opacity: 0; transform: scale(.94); transition: opacity .6s, transform .6s;
  }
  #intro .title.on { opacity: 1; transform: none; }
  #intro .title .cursor { display: inline-block; width: .55em; height: 1em; background: var(--green); vertical-align: -.12em; animation: blink .8s steps(1) infinite; margin-inline-start: 6px; }
  #intro .skip {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(0,230,118,.6); font: 600 .8rem "JetBrains Mono", monospace; letter-spacing: .1em;
  }
  #intro.done { opacity: 0; visibility: hidden; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Nav */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(5,8,13,.82); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
  .logo { font-weight: 800; color: var(--green); direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .logo .r { color: var(--red); }
  .links { display: flex; gap: 22px; font-size: .95rem; color: var(--muted); }
  .links a:hover { color: var(--blue); }
  .lang {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: .85rem;
  }
  .lang:hover { border-color: var(--blue); color: var(--blue); }

  /* Hero */
  header.hero { padding: 110px 0 90px; }
  .tag { color: var(--red); font-size: .9rem; margin-bottom: 14px; }
  h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 800; line-height: 1.15; }
  h1 .name {
    background: linear-gradient(90deg, var(--green), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 .role { display: block; font-size: .55em; font-weight: 600; color: var(--text); margin-top: 10px; }
  h1 .role::before { content: "> "; color: var(--red); font-family: "JetBrains Mono", monospace; }
  .hero p.lead { color: var(--muted); font-size: 1.2rem; max-width: 620px; margin: 20px 0 34px; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    padding: 12px 24px; border-radius: 10px; font-weight: 600; border: 1px solid var(--line);
    transition: transform .15s, border-color .15s, box-shadow .15s; display: inline-block;
  }
  .btn:hover { transform: translateY(-2px); border-color: var(--blue); box-shadow: 0 0 20px rgba(47,128,255,.25); }
  .btn.primary { background: var(--green); color: #00140a; border-color: var(--green); }
  .btn.primary:hover { box-shadow: 0 0 24px rgba(0,230,118,.45); }

  /* Sections */
  section { padding: 70px 0; }
  h2 { font-size: 1.8rem; margin-bottom: 28px; display: flex; align-items: center; gap: 12px; }
  h2 .num { color: var(--red); font-size: 1rem; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--green), var(--blue), var(--red)); opacity: .45; }
  [dir="rtl"] h2::after { background: linear-gradient(270deg, var(--green), var(--blue), var(--red)); }
  .about { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40px; align-items: start; }
  .about p { color: var(--muted); margin-bottom: 14px; }
  .about h3 { font-size: 1.2rem; font-weight: 800; color: var(--text); margin: 26px 0 10px; }
  .about h3:first-child { margin-top: 0; }
  .about h3::before {
    content: ""; display: inline-block; width: 4px; height: 1.05em; vertical-align: -0.15em;
    margin-inline-end: 10px; border-radius: 3px; background: linear-gradient(var(--green), var(--blue));
  }
  .about-list { list-style: none; display: grid; gap: 10px; margin: 0 0 6px; }
  .about-list li {
    --c: var(--green);
    color: var(--muted); padding: 10px 14px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line); border-inline-start: 3px solid var(--c);
  }
  .about-list li:nth-child(3n+2) { --c: var(--blue); }
  .about-list li:nth-child(3n) { --c: var(--red); }
  .about-list b { color: var(--c); font-weight: 700; }
  .about p.about-end { color: var(--green); font-weight: 700; margin-top: 18px; text-shadow: 0 0 12px rgba(0,230,118,.45); }
  .about-end::before { content: "> "; color: var(--red); }
  .avatar {
    aspect-ratio: 1; border-radius: var(--radius); border: 1px solid var(--line);
    background:
      radial-gradient(circle at 30% 20%, rgba(0,230,118,.18), transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(255,46,85,.15), transparent 55%),
      linear-gradient(135deg, var(--card), var(--bg-2));
    display: grid; place-items: center; font: 800 4rem "JetBrains Mono", monospace; color: var(--green);
    text-shadow: 0 0 20px rgba(0,230,118,.5);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar:has(img) { border-color: rgba(47,128,255,.45); box-shadow: 0 0 40px rgba(47,128,255,.25), 0 0 0 1px rgba(0,230,118,.15) inset; }

  /* Edge */
  .edge { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .edge .item {
    --c: var(--green);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; position: relative; overflow: hidden; transition: transform .2s, border-color .2s;
  }
  .edge .item::before { content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
  .edge .item:hover { border-color: var(--c); }
  /* תלת ממד: הכרטיס מתהפך לפי העכבר, והבהק עוקב אחריו */
  .edge { perspective: 900px; }
  .edge .item { transform-style: preserve-3d; will-change: transform; }
  .edge .item::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--c) 22%, transparent), transparent 65%);
    opacity: 0; transition: opacity .3s;
  }
  .edge .item.tilt::after { opacity: 1; }
  .edge .item.tilt { transition: border-color .2s; box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 30px color-mix(in srgb, var(--c) 18%, transparent); }

  /* רשת הנוירונים ברקע ושובל ה-0/1 של העכבר */
  #neural { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  #trail { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }
  .edge .k { font: 800 .8rem "JetBrains Mono", monospace; color: var(--c); letter-spacing: .08em; direction: ltr; unicode-bidi: isolate; }
  [dir="rtl"] .edge .k { text-align: right; }
  h2 .num { direction: ltr; unicode-bidi: isolate; }   /* "01." נשאר בסדר הנכון גם בזמן ההתפרקות */
  .edge h3 { font-size: 1.15rem; margin: 6px 0 8px; }
  .edge p { color: var(--muted); font-size: .95rem; }
  .edge-lead { color: var(--muted); max-width: 680px; margin: -8px 0 26px; font-size: 1.05rem; }

  .skills { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { padding: 8px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: .9rem; }
  .chip:nth-child(3n+1) { color: var(--green); } .chip:nth-child(3n+2) { color: var(--blue); } .chip:nth-child(3n) { color: var(--red); }

  .timeline { border-inline-start: 2px solid var(--line); padding-inline-start: 24px; }
  .job { position: relative; margin-bottom: 34px; }
  .job::before {
    content: ""; position: absolute; inset-inline-start: -31px; top: 8px;
    width: 12px; height: 12px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 4px rgba(0,230,118,.15);
  }
  .job .when { color: var(--red); font-size: .85rem; }
  .job h3 { font-size: 1.15rem; }
  .job .where { color: var(--blue); }
  .job p { color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px; transition: transform .2s, border-color .2s; display: flex; flex-direction: column; gap: 10px;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--blue); }
  .card h3 { font-size: 1.15rem; }
  .card p { color: var(--muted); flex: 1; }
  .card .stack { display: flex; flex-wrap: wrap; gap: 8px; font-size: .78rem; color: var(--green); }

  .contact { text-align: center; }
  .contact p { color: var(--muted); max-width: 520px; margin: 0 auto; }
  #contact { padding-bottom: 40px; }

  /* ===== בועות הכלים ===== */
  .bubbles {
    position: relative; height: 660px; margin-top: 8px; overflow: hidden;
    border-radius: 22px; border: 1px solid var(--line);
    background:
      radial-gradient(ellipse at 20% 0%, rgba(0,230,118,.07), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(47,128,255,.08), transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(255,46,85,.03), transparent 60%),
      var(--bg-2);
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  .bubble {
    --c: #ffffff;
    position: absolute; left: 0; top: 0; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.16), rgba(255,255,255,.03) 45%, transparent 70%),
      radial-gradient(circle at 50% 120%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%),
      rgba(13,21,32,.92);
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow: 0 0 26px color-mix(in srgb, var(--c) 22%, transparent), inset 0 0 18px rgba(255,255,255,.04);
    cursor: grab; will-change: transform; touch-action: none;
    transition: box-shadow .2s, border-color .2s;
  }
  .bubble:hover { border-color: var(--c); box-shadow: 0 0 34px color-mix(in srgb, var(--c) 45%, transparent), inset 0 0 18px rgba(255,255,255,.06); }
  .bubble.grab { cursor: grabbing; }
  .bubble img { width: 40%; height: 40%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  .bubble span {
    font: 600 12px "JetBrains Mono", monospace; color: var(--text); opacity: .85; white-space: nowrap;
    pointer-events: none; direction: ltr;
  }
  .bubble.s span { font-size: 9.5px; }
  .bubble.s img { width: 38%; height: 38%; }
  .bubble.nolabel span { display: none; }
  .bubble.nolabel img { width: 52%; height: 52%; }
  @media (max-width: 760px) { .bubbles { height: 720px; } .bubble span { font-size: 9px; } }

  /* אייקונים */
  .icons { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .icons a {
    --c: var(--green);
    width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); color: var(--c);
    transition: transform .2s, color .2s, border-color .2s, box-shadow .2s;
  }
  .icons a:hover { color: var(--c); border-color: var(--c); transform: translateY(-3px); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 40%, transparent); }
  .icons svg { width: 24px; height: 24px; }
  .icons a[title="LinkedIn"] svg { border-radius: 3px; }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 44px 0 36px; border-top: 1px solid var(--line); }
  footer .icons { margin-bottom: 22px; }
  footer .brandline { height: 3px; width: 120px; margin: 0 auto 18px; border-radius: 3px; background: linear-gradient(90deg, var(--green), var(--blue), var(--red)); }

  /* ===== פענוח הכותרת בכניסה לאתר ===== */
  .mx-w { white-space: nowrap; }                 /* מילה שלמה לא נשברת באמצע */
  .mx { position: relative; }
  /* הספרה 0/1 שמחליפה את האות. קיימת רק בזמן ההתפרקות, כדי לא לשבש את סדר הטקסט במנוחה */
  .mx[data-g]::after {
    content: attr(data-g);
    position: absolute; left: 0; right: 0; top: 0; text-align: center;
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-style: normal;
    color: var(--green); -webkit-text-fill-color: var(--green);
    text-shadow: 0 0 8px rgba(0,230,118,.9), 0 0 18px rgba(0,230,118,.35);
    opacity: var(--go, 0); transform: translateY(var(--gy, 0));
    pointer-events: none;
  }

  /* רק דהייה פנימה, בלי תזוזה, כדי שמיקום האותיות יישאר קבוע לאנימציית המטריקס */
  .reveal { opacity: 0; transition: opacity .7s; }
  .reveal.in { opacity: 1; }

  @media (max-width: 760px) {
    .links { display: none; }
    .about { grid-template-columns: 1fr; }
    .avatar { max-width: 220px; }
    header.hero { padding: 70px 0 50px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #intro { display: none; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<canvas id="neural" aria-hidden="true"></canvas>
<canvas id="trail" aria-hidden="true"></canvas>

<div id="intro" aria-hidden="true">
  <canvas id="matrix"></canvas>
  <div class="center"><div class="title" id="introTitle"><span id="introText"></span><span class="cursor"></span></div></div>
  <div class="skip" id="introSkip">CLICK TO SKIP</div>
</div>

<nav>
  <div class="wrap">
    <a href="#top" class="logo mono"><span class="r">&lt;</span><span data-k="logo"></span><span class="r"> /&gt;</span></a>
    <div class="links">
      <a href="#about" data-k="nav.about"></a>
      <a href="#edge" data-k="nav.edge"></a>
      <a href="#tools" data-k="nav.tools"></a>
      <a href="#skills" data-k="nav.skills"></a>
      <a href="#experience" data-k="nav.experience"></a>
      <a href="#projects" data-k="nav.projects"></a>
      <a href="#contact" data-k="nav.contact"></a>
    </div>
    <button class="lang mono" id="langBtn"></button>
  </div>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <div class="tag mono" data-k="hero.hello"></div>
    <h1><span class="name" data-k="hero.name"></span><span class="role" data-k="hero.role"></span></h1>
    <p class="lead" data-k="hero.lead"></p>
    <div class="btns">
      <a class="btn primary" href="#edge" data-k="hero.cta1"></a>
      <a class="btn" href="#contact" data-k="hero.cta2"></a>
    </div>
  </div>
</header>

<section id="about" class="reveal">
  <div class="wrap">
    <h2><span class="num mono"></span><span data-k="nav.about"></span></h2>
    <div class="about">
      <div id="aboutText"></div>
      <div class="avatar" id="avatar"></div>
    </div>
  </div>
</section>

<section id="edge" class="reveal">
  <div class="wrap">
    <h2><span class="num mono"></span><span data-k="nav.edge"></span></h2>
    <p class="edge-lead" data-k="edgeLead"></p>
    <div class="edge" id="edgeList"></div>
  </div>
</section>

<section id="tools" class="reveal">
  <div class="wrap">
    <h2><span class="num mono"></span><span data-k="nav.tools"></span></h2>
    <p class="edge-lead" data-k="toolsLead"></p>
    <div class="bubbles" id="bubbles" role="list"></div>
  </div>
</section>

<section id="skills" class="reveal">
  <div class="wrap">
    <h2><span class="num mono"></span><span data-k="nav.skills"></span></h2>
    <div class="skills" id="skillsList"></div>
  </div>
</section>

<section id="experience" class="reveal">
  <div class="wrap">
    <h2><span class="num mono"></span><span data-k="nav.experience"></span></h2>
    <div class="timeline" id="jobs"></div>
  </div>
</section>

<section id="projects" class="reveal">
  <div class="wrap">
    <h2><span class="num mono"></span><span data-k="nav.projects"></span></h2>
    <div class="grid" id="projectsGrid"></div>
  </div>
</section>

<section id="contact" class="reveal contact">
  <div class="wrap">
    <h2><span class="num mono"></span><span data-k="nav.contact"></span></h2>
    <p data-k="contact.text"></p>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="icons" id="footerIcons"></div>
    <div class="brandline"></div>
    <span data-k="hero.name"></span> · <span id="year"></span>
  </div>
</footer>

};

    hero: {

const get = (obj, path) => path.split(".").reduce((o, k) => o && o[k], obj);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function iconLinks() {
  return PROFILE.contacts.map(c => {
    const ext = c.url.startsWith("http");
    return `<a href="${esc(c.url)}" style="--c:${c.color}" aria-label="${esc(c.label)}" title="${esc(c.label)}"${ext ? ' target="_blank" rel="noopener"' : ""}>${ICONS[c.icon]}</a>`;
  }).join("");
}

function render(lang) {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  document.title = t.hero.name;
  document.querySelectorAll("[data-k]").forEach(el => { el.textContent = get(t, el.dataset.k); });
  document.getElementById("langBtn").textContent = t.langBtn;

  document.getElementById("aboutText").innerHTML = t.about.map(b =>
    b.h ? `<h3>${esc(b.h)}</h3>` :
    b.ul ? `<ul class="about-list">${b.ul.map(([k, d]) => `<li><b>${esc(k)}</b><span> – ${esc(d)}</span></li>`).join("")}</ul>` :
    b.end ? `<p class="about-end mono">${esc(b.end)}</p>` :
    `<p>${esc(b.p)}</p>`).join("");
  document.getElementById("avatar").innerHTML = PROFILE.photo
    ? `<img src="${esc(PROFILE.photo)}" alt="${esc(t.hero.name)}">`
    : esc(PROFILE.initials);
  const edgeColors = ["var(--green)", "var(--blue)", "var(--red)", "var(--green)"];
  document.getElementById("edgeList").innerHTML = t.edge.map((e, i) => `
    <div class="item" style="--c:${edgeColors[i % 4]}">
      <div class="k">${esc(e.k)}</div>
      <h3>${esc(e.t)}</h3>
      <p>${esc(e.d)}</p>
    </div>`).join("");
  document.getElementById("skillsList").innerHTML = PROFILE.skills.map(s => `<span class="chip mono">${esc(s)}</span>`).join("");
  document.getElementById("jobs").innerHTML = t.jobs.map(j => `
    <div class="job">
      <div class="when mono">${esc(j.when)}</div>
      <h3>${esc(j.title)} · <span class="where">${esc(j.where)}</span></h3>
      <p>${esc(j.desc)}</p>
    </div>`).join("");
  document.getElementById("projectsGrid").innerHTML = t.projects.map(p => `
    <a class="card" href="${esc(p.url)}" target="_blank" rel="noopener">
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.desc)}</p>
      <div class="stack mono">${p.stack.map(s => `<span>${esc(s)}</span>`).join("")}</div>
      <span class="mono" style="color:var(--blue);font-size:.85rem">${esc(t.view)}</span>
    </a>`).join("");
  document.getElementById("footerIcons").innerHTML = iconLinks();
  document.getElementById("year").textContent = new Date().getFullYear();

  // הסתרת אזורים ריקים (וגם הקישור אליהם בתפריט)
  const has = { skills: PROFILE.skills.length, experience: t.jobs.length, projects: t.projects.length };
  let n = 1;
  ["about", "edge", "tools", "skills", "experience", "projects", "contact"].forEach(id => {
    const show = !(id in has) || has[id] > 0;
    document.getElementById(id).style.display = show ? "" : "none";
    document.querySelector(`.links a[href="#${id}"]`).style.display = show ? "" : "none";
    if (show) document.querySelector(`#${id} h2 .num`).textContent = String(n++).padStart(2, "0") + ".";
  });
}

let lang = "he";
try { lang = localStorage.getItem("lang") || "he"; } catch (e) {}
render(lang);
document.getElementById("langBtn").onclick = () => {
  lang = lang === "he" ? "en" : "he";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render(lang);
};

    const el = document.createElement("div");
    el.className = "bubble" + (t.size < 0.7 ? " s" : "");
    el.setAttribute("role", "listitem");
    el.setAttribute("aria-label", t.n);
    el.style.setProperty("--c", t.color);
    el.innerHTML = `<img src="icons/${t.i}.svg" alt="" draggable="false"><span>${t.n}</span>`;
    box.appendChild(el);
    return { el, t, x: 0, y: 0, vx: 0, vy: 0, r: 0, m: 1, held: false };
  });

  let W = 0, H = 0, placed = false;
  function layout() {
    W = box.clientWidth; H = box.clientHeight;
    if (W < 100 || H < 100) return;   // האזור עוד לא קיבל גודל; ננסה שוב כשיקבל
    const first = !placed; placed = true;
    // גודל הבועות מחושב לפי שטח האזור, כך שהן ממלאות כ-36% ממנו בכל מסך ובכל כמות
    const sumSq = balls.reduce((s, b) => s + b.t.size * b.t.size, 0);
    const fill = W < 600 ? 0.44 : 0.36;   // בטלפון קצת יותר צפוף, כדי שהבועות לא ייצאו זעירות
    const R = Math.min(66, Math.sqrt((fill * W * H) / (Math.PI * sumSq)));
    balls.forEach(b => {
      b.r = R * b.t.size;
      b.m = b.r * b.r;
      b.el.style.width = b.el.style.height = (b.r * 2) + "px";
      b.el.classList.toggle("nolabel", b.r < 28);   // בבועה קטנה מדי מציגים רק לוגו
    });
    if (first) {
      // פיזור התחלתי בלי חפיפות (הגדולות קודם)
      [...balls].sort((a, b) => b.r - a.r).forEach(b => {
        for (let k = 0; k < 400; k++) {
          b.x = b.r + Math.random() * (W - 2 * b.r);
          b.y = b.r + Math.random() * (H - 2 * b.r);

  function draw() { balls.forEach(b => { b.el.style.transform = `translate(${b.x - b.r}px, ${b.y - b.r}px)`; }); }

      if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
      if (b.y < b.r)     { b.y = b.r;     b.vy =  Math.abs(b.vy); }
      if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy); }
      // אחרי זריקה חזקה הבועה מאטה בהדרגה חזרה למהירות שיוט
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > MAX) { b.vx *= MAX / sp; b.vy *= MAX / sp; }
      else if (sp > CRUISE * 1.4) { b.vx *= 0.985; b.vy *= 0.985; }
      else if (sp < CRUISE * 0.6) { b.vx += (Math.random() - .5) * 0.08; b.vy += (Math.random() - .5) * 0.08; }
    }
    // התנגשויות בין בועות (התנגשות אלסטית לפי מסה)
    for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], c = balls[j];
      const dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy), min = a.r + c.r;
      if (d >= min || d === 0) continue;
      const nx = dx / d, ny = dy / d;
      const ma = a.held ? 1e9 : a.m, mc = c.held ? 1e9 : c.m;
      const overlap = min - d, tot = ma + mc;
      if (!a.held) { a.x -= nx * overlap * (mc / tot); a.y -= ny * overlap * (mc / tot); }
      if (!c.held) { c.x += nx * overlap * (ma / tot); c.y += ny * overlap * (ma / tot); }
      const rv = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
      if (rv > 0) continue;
      const imp = (-2 * rv) / (1 / ma + 1 / mc);
      if (!a.held) { a.vx -= (imp / ma) * nx; a.vy -= (imp / ma) * ny; }
      if (!c.held) { c.vx += (imp / mc) * nx; c.vy += (imp / mc) * ny; }

  }

  // תפיסה וזריקה עם העכבר או האצבע
  let drag = null;
  box.addEventListener("pointerdown", e => {

    const b = balls.find(x => x.el === el);

    drag.hist.push({ x: b.x, y: b.y, t: performance.now() });
    if (drag.hist.length > 6) drag.hist.shift();
    if (still) draw();
  });
  const release = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const b = drag.b, h = drag.hist;
    if (h.length > 1) {

      b.vx = ((q.x - p.x) / ms) * 16; b.vy = ((q.y - p.y) / ms) * 16;   // מהירות הזריקה
    }

  // האנימציה רצה רק כשהאזור נראה על המסך
  let visible = false, last = 0;
  new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) { last = 0; requestAnimationFrame(loop); } }).observe(box);
  function loop(t) {

    while (nodes.length < want) nodes.push({

      const sp = Math.hypot(n.vx, n.vy);
      if (sp < 0.12) { n.vx += (Math.random() - .5) * .04; n.vy += (Math.random() - .5) * .04; }
      n.x += n.vx; n.y += n.vy;
      if (n.x < -20) n.x = W + 20; if (n.x > W + 20) n.x = -20;
      if (n.y < -20) n.y = H + 20; if (n.y > H + 20) n.y = -20;
    }
    // קווים: כל זוג נקודות קרובות מתחבר. השקיפות לפי המרחק

/* ===== שובל של 0 ו-1 ירוקים אחרי העכבר (רק במחשב, לא במסך מגע) ===== */

/* ===== כרטיסי ה-Edge מתהפכים בתלת ממד לפי העכבר ===== */

   כשמסך הפתיחה נסגר, כל אות "מפוענחת" בתורה, לפי סדר הקריאה.

      const x = i * size, y = drops[i];
      // הראש של כל טור בהיר, והזנב ירוק
      ctx.shadowColor = "#00e676"; ctx.shadowBlur = 8;
      ctx.fillStyle = "#c8ffe0";
      ctx.fillText(ch, x, y);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#00e676";
      ctx.fillText(Math.random() < 0.5 ? "0" : "1", x, y - size);
      drops[i] += size * speeds[i];
      if (drops[i] > h + size * 2 && Math.random() > 0.96) drops[i] = -size * Math.random() * 10;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // כיתוב שמוקלד אחרי שהגל מתחיל
  const title = document.getElementById("introTitle"), txt = document.getElementById("introText");
  const word = "MALACHI MIRVIS";
  setTimeout(() => {
    title.classList.add("on");
    let k = 0;
    const typer = setInterval(() => { txt.textContent = word.slice(0, ++k); if (k >= word.length) clearInterval(typer); }, 70);
  }, 900);

  let closed = false;
  function close() {
    if (closed) return; closed = true;
    intro.classList.add("done");
    document.body.style.overflow = "";
    window.dispatchEvent(new Event("introdone"));   // מתחיל את פענוח הכותרת
    setTimeout(() => { running = false; intro.remove(); }, 950);
  }
  setTimeout(close, 4200);
  intro.addEventListener("click", close);
  addEventListener("keydown", close, { once: true });
})();
</script>
</body>
